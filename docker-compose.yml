services:
  app:
    container_name: millinks_webapp
    image: millinks/millinks-webapp:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        - NEXT_PUBLIC_API_AUTH_URL
        - NEXT_PUBLIC_API_BASE_URL
        - NEXT_PUBLIC_BASE_PATH
        - NEXT_PUBLIC_FARO_ENVIRONMENT_NAME
        - NEXT_PUBLIC_FARO_APP_NAME
        - NEXT_PUBLIC_FARO_COLLECTOR_URL
        - NEXT_PUBLIC_GA_MEASUREMENT_ID
      secrets:
        - millinks_webapp_env
    env_file:
      - .env
    ports:
      - '3000:3000'
    networks:
      - network

  docs:
    container_name: millinks_docs
    image: millinks/millinks-docs:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: docs
    ports:
      - '8080:8080'
    networks:
      - network

secrets:
  millinks_webapp_env:
    file: .env

networks:
  network:
    driver: bridge
